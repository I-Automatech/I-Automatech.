<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="icon" type="image/png" href="Logo/Logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jig & Fixture - I-Automatech Company</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style2.css">
</head>
<body>
s
    <div id="Head-placeholder"></div>

    <div class="about-header text-center shadow-sm">
        <div class="container px-4">
            <h1 class="display-5 fw-bold m-0"> Change Belt </h1>
        </div>
    </div>
   
    <div class="container my-5 px-4" style="max-width: 1200px;"> 
        <div class="row g-4"> 
            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <img src="MD9/md9.1.jpg" class="jig-img" alt="Jig Fixture 2" onerror="this.src='https://placehold.co/400x400?text=Jig+Fixture+2'">         
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Change Belt </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;"> Change Belt </div>
                </div>
            </div>
        
            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <img src="MD9/Logo2.jpg" class="jig-img" alt="Jig Fixture 2" onerror="this.src='https://placehold.co/400x400?text=Jig+Fixture+2'">         
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Modify </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;"> Modify </div>
                </div>
            </div>

            


        </div>
    </div>
    
    <div class="modal fade" id="imageLightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="background: transparent; border: none;">
                <div class="modal-header border-0 p-0 justify-content-end">
                    <button type="button" class="btn-close btn-close-white fs-4 p-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 text-center">
                    <img id="lightboxImage" src="" class="img-fluid rounded shadow-lg" style="max-height: 75vh; object-fit: contain;">
                    <div id="lightboxCaption" class="lightbox-caption-text"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="Foot1-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // 1. ดึงข้อมูลไฟล์ Head.html
    fetch('Head.html') 
        .then(response => {
            if (!response.ok) throw new Error("หาไฟล์ Head.html ไม่เจอจ้า");
            return response.text();
        })
        .then(data => {
            document.getElementById('Head-placeholder').innerHTML = data;
        })
        .catch(error => console.error('มีปัญหาในการโหลด Head:', error));

    // 2. ดึงข้อมูลไฟล์ Foot1.html
    fetch('Foot1.html')
        .then(response => {
            if (!response.ok) throw new Error("หาไฟล์ Foot1.html ไม่เจอจ้า");
            return response.text();
        })
        .then(data => {
            document.getElementById('Foot1-placeholder').innerHTML = data;
        })
        .catch(error => console.error('มีปัญหาในการโหลด Foot1:', error));

    // 🌟 3. สคริปต์เปิดดูรูปภาพขนาดเต็ม พร้อมดึงคำอธิบายไปไว้ใต้รูปใน Modal
    document.addEventListener("DOMContentLoaded", function () {
        const lightboxModalEl = document.getElementById('imageLightboxModal');
        const lightboxModal = new bootstrap.Modal(lightboxModalEl);
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const imgWrappers = document.querySelectorAll('.jig-img-wrapper');

        imgWrappers.forEach(wrapper => {
            wrapper.addEventListener('click', function () {
                const targetImg = this.querySelector('.jig-img');
                // ค้นหาข้อความบรรยายที่อยู่ภายในการ์ดเดียวกัน
                const card = this.closest('.jig-card');
                const captionSource = card.querySelector('.jig-caption-source');

                if (targetImg) {
                    lightboxImage.src = targetImg.src;
                    // ดึงข้อความจากซอร์สมาใส่ใต้รูปใน Modal
                    lightboxCaption.innerHTML = captionSource ? captionSource.innerHTML : '';
                    lightboxModal.show();
                }
            });
        });
    });
    </script>
</body>
</html>
