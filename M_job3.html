<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="icon" type="image/png" href="Logo/Logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jig & Fixture - I-Automatech Company</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style2.css">
</head>
<body>

    <div id="Head-placeholder"></div>

    <div class="about-header text-center shadow-sm">
        <div class="container px-4">
            <h1 class="display-5 fw-bold m-0"> Auto Turn Table </h1>
        </div>
    </div>
   
    <div class="container my-5 px-4" style="max-width: 1200px;"> 
        <div class="row g-4"> 
            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <img src="M3/Logo2.jpg" class="jig-img" alt="Jig Fixture 1" onerror="this.src='https://placehold.co/400x400?text=Jig+Fixture+1'">
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Turn Table </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;"> Turn Table </div>
                </div>
            </div>   
        
            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <img src="M3/m3.2.jpg" class="jig-img" alt="Jig Fixture 1" onerror="this.src='https://placehold.co/400x400?text=Jig+Fixture+1'">
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Before </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;"> Before </div>
                </div>
            </div>   

            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <img src="M3/Logo2.jpg" class="jig-img" alt="Jig Fixture 2" onerror="this.src='https://placehold.co/400x400?text=Jig+Fixture+2'">         
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Turn Table </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;"> Turn Table </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 mx-auto">
                <div class="jig-card">
                    <div class="jig-img-wrapper">
                        <video class="jig-img" autoplay loop muted playsinline style="pointer-events: none;">
                            <source src="M3/m3.3.mp4" type="video/mp4">
                            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                        </video>
                    </div>
                    <div class="jig-overlay-box">
                        <div class="jig-overlay-text"> Video </div>
                    </div>
                    <div class="jig-caption-source" style="display:none;" data-video="M3/m3.3.mp4"> Video </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <div class="modal fade" id="imageLightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="background: transparent; border: none;">
                <div class="modal-header border-0 p-0 justify-content-end" style="position: relative; z-index: 1060;">
                    <button type="button" class="btn-close btn-close-white fs-4 p-3" data-bs-dismiss="modal" aria-label="Close" style="background-color: rgba(0,0,0,0.5); border-radius: 50%;"></button>
                </div>
                <div class="modal-body p-0 text-center">
                    <img id="lightboxImage" src="" class="img-fluid rounded shadow-lg d-none" style="max-height: 75vh; object-fit: contain; width: 100%;">
                    
                    <video id="lightboxVideo" controls class="img-fluid rounded shadow-lg d-none" style="max-height: 75vh; object-fit: contain; width: 100%;">
                        <source src="" type="video/mp4">
                    </video>
                    
                    <div id="lightboxCaption" class="lightbox-caption-text"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="Foot1-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // 1. ดึงข้อมูลไฟล์ Head.html
    fetch('Head.html') 
        .then(response => {
            if (!response.ok) throw new Error("หาไฟล์ Head.html ไม่เจอจ้า");
            return response.text();
        })
        .then(data => {
            document.getElementById('Head-placeholder').innerHTML = data;
        })
        .catch(error => console.error('มีปัญหาในการโหลด Head:', error));

    // 2. ดึงข้อมูลไฟล์ Foot1.html
    fetch('Foot1.html')
        .then(response => {
            if (!response.ok) throw new Error("หาไฟล์ Foot1.html ไม่เจอจ้า");
            return response.text();
        })
        .then(data => {
            document.getElementById('Foot1-placeholder').innerHTML = data;
        })
        .catch(error => console.error('มีปัญหาในการโหลด Foot1:', error));

    // 🌟 3. ปรับปรุงสคริปต์ให้สามารถจัดการเปิดและปิดวิดีโอ/รูปภาพผ่าน Modal ร่วมกันได้อย่างถูกต้อง
    document.addEventListener("DOMContentLoaded", function () {
        const lightboxModalEl = document.getElementById('imageLightboxModal');
        const lightboxModal = new bootstrap.Modal(lightboxModalEl);
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxVideo = document.getElementById('lightboxVideo');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const imgWrappers = document.querySelectorAll('.jig-img-wrapper');

        imgWrappers.forEach(wrapper => {
            wrapper.addEventListener('click', function () {
                const card = this.closest('.jig-card');
                const captionSource = card.querySelector('.jig-caption-source');
                
                // ตรวจดูว่าเป็นวิดีโอหรือไม่
                const videoUrl = captionSource ? captionSource.getAttribute('data-video') : null;

                // ล้างค่าและซ่อนองค์ประกอบเดิมก่อนเปิดใหม่
                lightboxImage.classList.add('d-none');
                lightboxVideo.classList.add('d-none');
                lightboxVideo.pause();
                lightboxVideo.src = "";

                if (videoUrl) {
                    // หากกดคลิกการ์ดที่เป็น วิดีโอ
                    lightboxVideo.src = videoUrl;
                    lightboxVideo.classList.remove('d-none');
                    lightboxVideo.load();
                    lightboxVideo.play(); // สั่งวิดีโอตัวใหญ่ให้เล่นทันทีเมื่อเด้งเปิด
                } else {
                    // หากกดคลิกการ์ดที่เป็น รูปภาพปกติ
                    const targetImg = this.querySelector('.jig-img');
                    if (targetImg) {
                        lightboxImage.src = targetImg.src;
                        lightboxImage.classList.remove('d-none');
                    }
                }

                // ใส่คำบรรยายสินค้า
                lightboxCaption.innerHTML = captionSource ? captionSource.innerHTML : '';
                lightboxModal.show();
            });
        });

        // ดักจับจังหวะปิดหน้าต่าง เพื่อสั่งปิดเสียงและหยุดเล่นวิดีโอทันที ไม่ให้ส่งเสียงค้าง
        lightboxModalEl.addEventListener('hidden.bs.modal', function () {
            lightboxVideo.pause();
            lightboxVideo.src = "";
        });
    });
    </script>
</body>
</html>
